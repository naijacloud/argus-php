name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow rather than repeating the matrix, so a tag
  # is verified by exactly the checks that guard main.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      # Every supported version is reported, rather than the run stopping at the
      # first failure: "8.1 broke" and "everything broke" need different fixes.
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, zlib
          coverage: none
          # The suite spawns `php -S` as the stand-in for Argus ingest. Without
          # this, a warning printed by the child would be indistinguishable
          # from a real failure.
          ini-values: error_reporting=E_ALL, display_errors=On

      # Not --strict: it warns about the `version` field, which is kept here
      # deliberately so the package states its own version in one obvious place
      # alongside Client::VERSION.
      - name: Validate composer.json
        run: composer validate

      # No lock file is committed (this is a library), so the range in
      # composer.json is what actually gets resolved here. That is the point.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint every PHP file
        run: |
          find src tests examples -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run the test suite
        run: vendor/bin/phpunit --colors=always

  # The core promises to work without ext-curl (shared hosts, slim images), by
  # falling back to PHP's own stream wrappers. Prove it with curl removed.
  no-curl:
    name: PHP 8.3 without ext-curl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: :curl, json, zlib
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On
          tools: composer
      - name: Confirm curl is gone
        run: php -r 'exit(function_exists("curl_init") ? 1 : 0);'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit --colors=always

  # The lowest versions the composer.json ranges allow, so a range is never a
  # promise nobody has run.
  lowest:
    name: PHP 8.1, lowest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json, zlib
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
      - run: vendor/bin/phpunit --colors=always
